  /* ---------- Page height ----------
     Measures where the page really ends and writes it to a CSS variable.
     The stylesheet applies it with !important, so Unbounce rewriting its
     own heights cannot bring a white bar back below the footer. */
  function fitPage() {
    var el = document.querySelector('.cmp-page');
    if (!el) return;

    var block = el.closest('.lp-pom-block');
    var root  = el.closest('#lp-pom-root, .lp-pom-root');

    if (block) { top = Math.max(0, Math.round(el.getBoundingClientRect().top - block.getBoundingClientRect().top)); }

  /* ---------- CTAs scroll to the form ----------
     Delegated from the document so late-added elements still work. */
  function scrollToForm() {
    var card = document.getElementById('talk');

    catch (err) { card.scrollIntoView(true); }

    document.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('.cmp-cta-link, a[href="#talk"]') : null;
      if (!a) return;
      e.preventDefault();

  /* ---------- Native Unbounce form ----------

  function findForm() { return document.querySelector('.lp-pom-form, .hs-form'); }

  function watchForForm() {
    if (placeForm()) return;

  function labelFor(slot, input) {
    var lab = input.id ? slot.querySelector('label[for="' + input.id + '"]') : null;

  function buildForm(slot) {

      note.innerHTML = 'By submitting, you agree to our <a href="' + TERMS_URL + '" target="_blank" rel="noopener">Terms of Service</a> and <a href="' + PRIVACY_URL + '" target="_blank" rel="noopener">Privacy Policy</a>.';

    form.addEventListener('invalid', function (ev) {
      var t = ev.target;
      if (t && t.classList) { t.classList.add('cmp-invalid'); }
    }, true);
    form.addEventListener('input', function (ev) {
      var t = ev.target;

  }

  function reapply() {

  var ASSETS = 'https://cdn.jsdelivr.net/gh/analytics117/directive-lp-assets@main/audiohook/competitor';

      var ORDER = NAMES.slice(); for (var q = ORDER.length - 1; q > 0; q--) { var j = Math.floor(hash(q + 41) * (q + 1)); var tmp = ORDER[q]; ORDER[q] = ORDER[j]; ORDER[j] = tmp; }
      for (var r = 0; r < rows; r++) {
        var cols = Math.max(1, Math.ceil(FW / (REF_W * sc)));
        for (var c = 0; c < cols; c++) {

            var mirror = (r + c) % 2 === 1;

            for (var q = 0; q < ORDER.length; q++) {
              var cand = ORDER[(k + q) % ORDER.length], ok = true;
              for (var z = 0; z < tiles.length; z++) { var o = tiles[z]; if (o.name === cand) { var dx = Math.abs(o.x0 - x), dy = Math.abs(o.y0 - y); dx = Math.min(dx, FW - dx); dy = Math.min(dy, FH - dy); if (dx < R && dy < R * .8) { ok = false; break; } } }

      var r = s * 0.12;
      if (t.d.blur) g.filter = 'blur(' + (t.d.blur * dpr) + 'px)';
      g.save(); g.shadowColor = 'rgba(21,21,21,' + (t.depth === 2 ? .22 : .14) + ')'; g.shadowBlur = 18 * dpr; g.shadowOffsetY = 8 * dpr;
      rr(g, pad, pad, s, r); g.fillStyle = '#fff'; g.fill(); g.restore();
      g.save(); rr(g, pad, pad, s, r); g.clip(); g.drawImage(im, pad, pad, s, s); g.restore();
      g.save(); rr(g, pad + .5, pad + .5, s - 1, r); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1 * dpr; g.stroke(); g.restore();

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);

        var t = tiles[i]; if (!t.tile) continue;
        var dist = time * speed * sc * t.d.spd;
        var x = mod(t.x0 + dir[0] * dist, FW) - M, y = mod(t.y0 + dir[1] * dist, FH) - M;
        y += Math.sin(time * 6.283 / t.per + t.ph) * t.amp; x += Math.cos(time * 6.283 / (t.per * 1.3) + t.ph) * t.amp * .5;

      }
      ctx.globalAlpha = 1;
    }

    ready.then(function () {
      build();
      
      if (!loaded && window.console) { console.warn('cmp: hero covers did not load. Check the GitHub upload.'); }
      var t = 0, last = null, raf = 0, visible = true;
      function loop(now) {
        if (last !== null) { t += Math.min(.1, (now - last) / 1000); }
        last = now; renderAt(t); raf = requestAnimationFrame(loop);

    });
  }


  /* ---------- Scroll reveal ---------- */
  function initReveal() {
    var els = document.querySelectorAll('.cmp-reveal, .cmp-col-glow');
    if (reduce || !hasIO) { [].forEach.call(els, function (el) { el.classList.add('is-in'); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {

    [].forEach.call(els, function (el) { io.observe(el); });
  }

  /* ---------- Stat count-up ----------
     <div data-count="4.2" data-decimals="1" data-prefix="" data-suffix="x">4.2x</div>
     The markup holds the final value, so no-JS and reduced motion see it. */
  function initCounts() {
    var els = document.querySelectorAll('[data-count]');
    if (reduce || !hasIO) return;
    function fmt(el, v) {
      var d = parseInt(el.getAttribute('data-decimals') || '0', 10);
      return (el.getAttribute('data-prefix') || '') + v.toFixed(d) + (el.getAttribute('data-suffix') || '');
    }
    function run(el) {
      var target = parseFloat(el.getAttribute('data-count'));
      if (!target) return;                      /* $0 stays $0 */
      var t0 = null;
      function step(t) {
        if (!t0) { t0 = t; }
        var p = Math.min(1, (t - t0) / COUNT_MS);
        var eased = 1 - Math.pow(1 - p, 3);

        if (p < 1) { requestAnimationFrame(step); }

      requestAnimationFrame(step);

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {

    [].forEach.call(els, function (el) { io.observe(el); });
  }

  /* ---------- Testimonial carousel ----------
     Auto-advances; arrows, dots and swipe also work. Pauses on hover,
     on keyboard focus and when off screen. */
  function initCarousel(root) {
    var slides = root.querySelectorAll('.cmp-slide');
    var dots = root.querySelectorAll('.cmp-dot');
    var prev = root.querySelector('[data-prev]');
    var next = root.querySelector('[data-next]');
    var i = 0, timer = null, hover = false, focus = false, visible = true;
    root.style.setProperty('--ms', TESTIMONIAL_MS + 'ms');

    function paused() { return reduce || hover || focus || !visible; }
    function schedule() {
      clearTimeout(timer);
      root.classList.toggle('is-paused', paused());
      if (!paused()) { timer = setTimeout(function () { show(i + 1); }, TESTIMONIAL_MS); }
    }
    function show(n) {
      i = (n + slides.length) % slides.length;
      [].forEach.call(slides, function (s, k) {
        s.classList.toggle('is-active', k === i);
        s.setAttribute('aria-hidden', k === i ? 'false' : 'true');
      });

        d.classList.toggle('is-active', k === i);

      setTimeout(fitPage, 60);

    if (next) { next.addEventListener('click', function () { show(i + 1); }); }
    [].forEach.call(dots, function (d, k) { d.addEventListener('click', function () { show(k); }); });

    root.addEventListener('mouseleave', function () { hover = false; schedule(); });
    root.addEventListener('focusin', function () { focus = true; schedule(); });
    root.addEventListener('focusout', function () { focus = false; schedule(); });

    root.addEventListener('pointerdown', function (e) { x0 = e.clientX; });

  ready(function () {

    safely('reveal', initReveal);

    safely('offscreen', initOffscreen);
    safely('fitPage', fitPage);
  });
  window.addEventListener('load', function () { placeForm(); fitPage(); });

})();
