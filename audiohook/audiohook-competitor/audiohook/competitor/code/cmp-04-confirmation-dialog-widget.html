<!-- ============================================================
     FORM CONFIRMATION DIALOG ONLY (thank-you popup)

     Goes into a Custom HTML widget placed on the CONFIRMATION
     DIALOG canvas in Unbounce, not on the page canvas.

     Fonts and styles are self-contained here, because the dialog
     does not inherit the page stylesheet. The frame around it
     (ink background, 16px corners, white close X that turns magenta)
     is styled by section 8 of cmp-02-stylesheet.css.

     Widget size in the builder: 560 wide x 360 high or larger.
     The card fills the dialog edge to edge.
     ============================================================ -->

<div class="cmp-thanks">
  <div class="cmp-thanks-inner">
    <div class="cmp-thanks-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none"><path d="M4 12.5l5.5 5.5L20 7" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <h2>Thanks, we&rsquo;ve got&nbsp;it.</h2>
    <p>A member of the Audiohook team will be in touch&nbsp;shortly.</p>
    <p class="cmp-thanks-meta">You can close this&nbsp;window.</p>
  </div>
</div>

<style>
