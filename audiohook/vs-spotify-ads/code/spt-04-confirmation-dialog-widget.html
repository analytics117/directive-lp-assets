<!-- ============================================================
     FORM CONFIRMATION DIALOG ONLY  |  AUDIOHOOK  |  VS. SPOTIFY ADS

     This is NOT the main page markup. It goes into a Custom HTML widget
     on the CONFIRMATION DIALOG canvas in Unbounce, not on the page canvas.
     Do this on both the desktop and mobile views. Delete the dialog's
     default text first.

     Recommended sizes (widget at X 0, Y 0, same size as the dialog):
       Desktop: 512 x 375      Mobile: 240 x 310

     The card fills the whole dialog edge to edge and scales its type to fit.
     The dialog's rounded corners and the close X (moved onto the card,
     top right) come from 02-stylesheet.css on the page. On short dialogs it drops
     the logo, then the footnote, then the check, so nothing is ever cut off.

     Styles and fonts are self-contained here, because the dialog
     does not inherit the page stylesheet.
     ============================================================ -->

<div class="spt-ty-box">
  <div class="spt-ty" role="status" aria-live="polite">
    <div class="spt-ty-card">
      <img class="spt-ty-logo" src="https://cdn.jsdelivr.net/gh/analytics117/directive-lp-assets@main/audiohook/vs-spotify-ads/images/spt-logo-light.svg" alt="Audiohook" width="120" height="18">

    </div>
  </div>
</div>

<script>
/* Unbounce loads the confirmation dialog as its own small page in a frame.
   When that's the case, the card takes over the whole frame, so it always
   matches the dialog's real size instead of the widget box. */
(function () {
  var framed = true;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) { document.documentElement.classList.add('spt-ty-framed'); }
})();
</script>
