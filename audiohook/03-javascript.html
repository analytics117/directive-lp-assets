<script>
(function () {

  /* ==========================================================
     AUDIOHOOK | PODCAST ADS COST (Directive kit)
     Paste into: Javascripts panel > Add New JavaScript,
     name it "Page scripts", placement Before Body End Tag.

     Does: section auto-height, CTA scroll to the form, moves the
     native Unbounce form into the hero card and styles it, the
     hero podcast-cover drift, testimonial controls, and a short
     report in the browser console.
     ========================================================== */

  /* ============================================================
     EDIT THESE LINES PER CLIENT. NOTHING ELSE.
     ============================================================ */
  var SUBMIT_LABEL = 'Talk to an expert';   /* text on the form's submit button */
  var ASSETS = 'https://cdn.jsdelivr.net/gh/analytics117/directive-lp-assets@main/audiohook/podcast-ads-cost';
  var TERMS_URL = 'https://audiohook.com/terms';
  var PRIVACY_URL = 'https://audiohook.com/privacy-policy';
  var TESTIMONIAL_MS = 5000;   /* time on each testimonial before it moves on */
  /* CTAs OFF: while true, clicking "Talk to an expert" (either button) or pressing
     Enter in the form does nothing, and nothing is submitted anywhere. Set to
     false when the page is live on Audiohook's domain and leads are routed. */
  var CTAS_DISABLED = true;
  /* ========================= END EDITS ========================= */

  /* Registered first and on window in the capture phase, so it runs before
     Unbounce's form handler and any tracking script that listens for submits. */
  if (CTAS_DISABLED) {
    var isCta = function (t) {
      return t && t.closest && t.closest('.exos-cta, a[href="#exos-form"], .lp-pom-form .lp-pom-button, .lp-pom-form button, .lp-pom-form input[type="submit"]');
    };
    var block = function (e) { e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation(); };
    ['click', 'pointerup', 'touchend'].forEach(function (type) {
      window.addEventListener(type, function (e) { if (isCta(e.target)) { block(e); } }, true);
    });
    window.addEventListener('submit', function (e) { if (e.target && e.target.closest && e.target.closest('.lp-pom-form')) { block(e); } }, true);
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target && e.target.closest && (e.target.closest('.lp-pom-form') || isCta(e.target))) { block(e); }
    }, true);
    console.log('Audiohook PAC: CTAs disabled, the form will not submit (CTAS_DISABLED = true)');
  }

  var TAG = 'Audiohook PAC: ';
  var report = {};

  /* Make sure a viewport tag exists. Without one, phones render
     at ~980px wide and no media query fires. */
  (function ensureViewport() {
    var m = document.querySelector('meta[name="viewport"]');
    if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
    m.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
  })();

  function ready(fn) {
    if (document.readyState !== 'loading') { fn(); }
    else { document.addEventListener('DOMContentLoaded', fn); }
  }

  /* Sizes Unbounce's page to end exactly where the design ends.
     The widget lives in Unbounce's positioned layer, not inside a section,
     and may sit a few pixels below the top or above extra empty sections,
     so this measures where the page really ends instead of trusting either. */
  function fitPage() {
    var el = document.querySelector('.exos-page');
    if (!el) return;
    var wrap = el.closest('[id^="lp-code"]');
    if (wrap) { wrap.style.height = 'auto'; wrap.style.setProperty('top', '0px', 'important'); wrap.style.setProperty('margin-top', '0px', 'important'); }
    var root = document.getElementById('lp-pom-root');
    var rootTop = root ? root.getBoundingClientRect().top : 0;
    var bottom = Math.floor(el.getBoundingClientRect().bottom - rootTop);
    var blocks = root ? [].slice.call(root.querySelectorAll('.lp-pom-block')) : [];
    var docEl = document.documentElement;
    if (blocks.length) {
      var first = blocks[0];
      first.classList.add('pac-fit-block');
      var h = Math.max(0, bottom - Math.round(first.getBoundingClientRect().top - rootTop));
      docEl.style.setProperty('--pac-block-h', h + 'px');
      /* any other (empty) sections would only add blank space below the footer */
      blocks.slice(1).forEach(function (b) { b.classList.add('pac-hide-block'); });
    }
    if (root) { root.classList.add('pac-fit-root'); docEl.style.setProperty('--pac-page-h', bottom + 'px'); }
    /* The heights are applied by the stylesheet with !important, so they hold
       even if Unbounce's own scripts write their builder heights back later. */
  }

  /* Light tracking hook: if GA4/GTM is on the page, CTA clicks are sent
     as events. Lead conversions are counted by Unbounce's own form. */
  function track(name, params) {
    try {
      if (typeof window.gtag === 'function') { window.gtag('event', name, params || {}); }
      else if (window.dataLayer && window.dataLayer.push) { window.dataLayer.push(Object.assign({ event: name }, params || {})); }
    } catch (e) {}
  }

  /* ---------- CTAs scroll to the form card ----------
     Delegated off the document so it can't be broken by binding order
     or by elements appearing late. */
  function scrollToCard() {
    var card = document.getElementById('exos-form-card') || document.getElementById('exos-form');
    if (!card) return;
    try { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    catch (err) { card.scrollIntoView(true); }
  }

  function initScroll() {
    document.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.exos-cta, a[href="#exos-form"], a[href="#get-started"]') : null;
      if (!btn) return;
      e.preventDefault();
      track('cta_click', { cta_text: (btn.textContent || '').trim(), cta_location: 'final_cta' });
      scrollToCard();
      /* Put the cursor in the first field once the scroll lands */
      setTimeout(function () {
        var first = document.querySelector('.exos-form-slot input[type="text"], .exos-form-slot input[type="email"]');
        if (first) { try { first.focus({ preventScroll: true }); } catch (x) { first.focus(); } }
      }, 700);
    }, false);
    report.ctas = document.querySelectorAll('.exos-cta').length;
  }

  /* ---------- The native Unbounce form, moved into the card ----------
     No relaying, no simulated clicks. Unbounce's own button submits its
     own form, so lead capture and conversion tracking are untouched. */
  function placeForm() {
    var slot = document.querySelector('.exos-form-slot');
    if (!slot) return false;
    var form = document.querySelector('.lp-pom-form');
    if (!form) return false;
    var widget = form.closest('[id^="lp-pom-form"]') || form;
    if (!slot.contains(widget)) { slot.appendChild(widget); }
    buildForm();
    fitPage();
    return true;
  }

  function watchForForm() {
    if (placeForm()) return;
    var obs = new MutationObserver(function () { if (placeForm()) { obs.disconnect(); } });
    obs.observe(document.body, { childList: true, subtree: true });
    setTimeout(function () {
      obs.disconnect();
      if (!document.querySelector('.exos-form-slot .lp-pom-form')) {
        console.warn(TAG + 'no Unbounce form found. Drag one form widget onto the canvas.');
      }
    }, 10000);
  }

  /* Unbounce sets pixel widths and absolute positions inline. Strip them
     so the stylesheet can lay the fields out full width. */
  function unstyle(root) {
    [].forEach.call(root.querySelectorAll('*'), function (el) {
      ['position', 'top', 'left', 'right', 'bottom', 'height', 'min-height', 'max-height',
       'width', 'min-width', 'max-width', 'transform', 'float', 'white-space', 'overflow',
       'text-overflow'].forEach(function (p) { el.style.removeProperty(p); });
    });
    root.style.removeProperty('height');
  }

  /* Agreement: if the form has a checkbox field, its label becomes the
     design's "I've read and agree to the Terms of Service and Privacy Policy"
     with real links. If there's no checkbox, a consent line shows under
     the button instead. */
  function buildAgreement(slot) {
    var box = slot.querySelector('input[type="checkbox"]');
    var note = document.querySelector('.pac-consent');
    if (!box) { if (note) { note.hidden = false; } report.agreement = 'consent line'; return; }
    if (note) { note.hidden = true; }
    var field = box.closest('.lp-pom-form-field') || box.parentElement;
    field.classList.add('pac-agree');
    var lab = (box.id && slot.querySelector('label[for="' + box.id + '"]')) || box.parentElement.querySelector('label');
    if (lab && !lab.getAttribute('data-pac')) {
      lab.setAttribute('data-pac', '1');
      lab.innerHTML = 'I’ve read and agree to the <a href="' + TERMS_URL + '" target="_blank" rel="noopener">Terms of Service</a> and <a href="' + PRIVACY_URL + '" target="_blank" rel="noopener">Privacy Policy</a>.';
      /* clicking a link opens it without ticking the box */
      [].forEach.call(lab.querySelectorAll('a'), function (a) { a.addEventListener('click', function (e) { e.stopPropagation(); }); });
    }
    report.agreement = 'checkbox';
  }

  function buildForm() {
    var slot = document.querySelector('.exos-form-slot');
    if (!slot || slot.getAttribute('data-built')) return;
    var form = slot.querySelector('form');
    if (!form) return;
    slot.setAttribute('data-built', '1');
    unstyle(slot);

    /* Design shows visible labels; also mirror them into aria-labels */
    var fields = 0;
    [].forEach.call(slot.querySelectorAll('input, select, textarea'), function (inp) {
      if (inp.type === 'hidden' || inp.type === 'submit' || inp.type === 'button') return;
      if (inp.type !== 'checkbox' && inp.type !== 'radio') { fields++; }
      var lab = inp.id && slot.querySelector('label[for="' + inp.id + '"]');
      if (lab && !inp.getAttribute('aria-label')) { inp.setAttribute('aria-label', (lab.textContent || '').replace(/\*\s*$/, '').trim()); }
      if (inp.type === 'email') { inp.setAttribute('autocomplete', 'email'); }
    });
    var ac = { first_name: 'given-name', last_name: 'family-name', company_name: 'organization' };
    Object.keys(ac).forEach(function (k) { var f = slot.querySelector('#' + k); if (f) { f.setAttribute('autocomplete', ac[k]); } });

    buildAgreement(slot);

    /* One step: keep Unbounce's own submit, relabel it, hide any extras */
    var first = null;
    [].forEach.call(slot.querySelectorAll('.lp-pom-button, button, input[type="submit"]'), function (b) {
      var wrap = b.closest('[id^="lp-pom-button"]') || b;
      if (!first) {
        first = b;
        if (b.tagName === 'INPUT') { b.value = SUBMIT_LABEL; }
        else { var l = b.querySelector('.label'); if (l) { l.textContent = SUBMIT_LABEL; } else { b.textContent = SUBMIT_LABEL; } }
        /* the button must come after the agreement row */
        (b.closest('form') || form).appendChild(wrap);
      } else { wrap.style.setProperty('display', 'none', 'important'); }
    });
    report.fields = fields;
    report.submit = !!first;
    if (!first) { console.warn(TAG + 'the form has no submit button'); }
    fitPage();
  }

  /* ---------- Hero: podcast covers drift bottom-left to top-right ----------
     Canvas, 38% opacity, masked in CSS. Pauses when the hero is off screen
     or the tab is hidden; holds still for reduced motion; not drawn on phones. */
  var L = [
    ["this-past-weekend",87,103,90,1],["giggly-squad",222,128,90,1],["office-ladies",180,170,95,0],["terribly-famous",400,128,125,2],
    ["planet-money",603,178,135,2],["the-daily",733,288,175,2],["morbid",765,128,75,1],["magnus-archives",810,90,80,0],
    ["rich-eisen-show",946,128,125,2],["office-ladies",888,242,120,0],["serial",1080,175,75,1],["diary-of-a-ceo",1205,105,55,1],
    ["good-hang",1160,128,70,0],["suspect",1375,103,120,2],["espn-radio",70,295,125,2],["dateline-nbc",242,268,80,1],
    ["call-her-daddy",316,318,90,1],["wait-wait",457,296,80,1],["good-hang",557,393,125,2],["dr-death",960,316,75,1],
    ["stuff-you-should-know",1115,295,125,2],["magnus-archives",1240,240,75,0],["z100-new-york",1460,258,125,2],["armchair-expert",1176,377,90,1],
    ["mel-robbins",1320,353,80,0],["huberman-lab",1430,420,90,1],["serial",1357,470,80,0],["this-american-life",398,480,125,2],
    ["youre-wrong-about",240,410,75,0],["the-moth",105,447,90,0],["giggly-squad",172,485,90,1],["mel-robbins",790,460,110,2],
    ["the-moth",860,430,90,0],["youre-wrong-about",1005,460,125,2],["crime-junkie",1193,513,95,1],["welcome-to-night-vale",655,545,95,1]
  ];
  var REF_W = 1536, REF_H = 600;
  var NAMES = ["this-past-weekend","giggly-squad","terribly-famous","planet-money","the-daily","morbid","rich-eisen-show","office-ladies","serial","diary-of-a-ceo","suspect","espn-radio","dateline-nbc","call-her-daddy","wait-wait","good-hang","this-american-life","dr-death","stuff-you-should-know","magnus-archives","z100-new-york","armchair-expert","mel-robbins","youre-wrong-about","crime-junkie","huberman-lab","welcome-to-night-vale","the-moth"];
  var DEPTH = { 0: { blur: 7, alpha: .55, spd: .55 }, 1: { blur: 0, alpha: 1, spd: .85 }, 2: { blur: 0, alpha: 1, spd: 1.1 } };

  function rr(ctx, x, y, s, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + s, y, x + s, y + s, r); ctx.arcTo(x + s, y + s, x, y + s, r); ctx.arcTo(x, y + s, x, y, r); ctx.arcTo(x, y, x + s, y, r); ctx.closePath(); }
  function hash(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  function initCovers() {
    var canvas = document.getElementById('pac-covers');
    if (!canvas || !canvas.getContext) return;
    if (!window.matchMedia || !matchMedia('(min-width: 641px)').matches) { report.covers = 'off (phone)'; return; }
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var base = ASSETS + '/images/pac-cover-', ext = '.jpg', speed = 18, scale = .78;
    var dir = [1, -0.58], dl = Math.sqrt(dir[0] * dir[0] + dir[1] * dir[1]); dir = [dir[0] / dl, dir[1] / dl];
    var ctx = canvas.getContext('2d'), imgs = {}, tiles = [], W = 0, H = 0, dpr = 1, FW = 0, FH = 0, M = 0;
    var loaded = 0;
    var ready = Promise.all(NAMES.map(function (n) {
      return new Promise(function (res) { var im = new Image(); im.onload = function () { imgs[n] = im; loaded++; res(); }; im.onerror = function () { res(); }; im.src = base + n + ext; });
    }));

    function build() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight;
      if (!W || !H) return;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      var sc = scale * Math.max(W, H * 1.6) / REF_W * 1.08;
      M = 200 * sc; FW = W + M * 2; var rowH = REF_H * sc; var rows = Math.max(1, Math.ceil((H + M * 2) / rowH)); FH = rows * rowH;
      tiles = []; var k = 0;
      var ORDER = NAMES.slice(); for (var q = ORDER.length - 1; q > 0; q--) { var j = Math.floor(hash(q + 41) * (q + 1)); var tmp = ORDER[q]; ORDER[q] = ORDER[j]; ORDER[j] = tmp; }
      for (var r = 0; r < rows; r++) {
        var cols = Math.max(1, Math.ceil(FW / (REF_W * sc)));
        for (var c = 0; c < cols; c++) {
          L.forEach(function (t) {
            var mirror = (r + c) % 2 === 1;
            var x = (mirror ? REF_W - t[1] : t[1]) * sc + c * REF_W * sc, y = t[2] * sc + r * rowH;
            if (x > FW + M) return;
            var name = null, R = 520 * sc;
            for (var q = 0; q < ORDER.length; q++) {
              var cand = ORDER[(k + q) % ORDER.length], ok = true;
              for (var z = 0; z < tiles.length; z++) { var o = tiles[z]; if (o.name === cand) { var dx = Math.abs(o.x0 - x), dy = Math.abs(o.y0 - y); dx = Math.min(dx, FW - dx); dy = Math.min(dy, FH - dy); if (dx < R && dy < R * .8) { ok = false; break; } } }
              if (ok) { name = cand; break; }
            }
            if (!name) name = ORDER[k % ORDER.length];
            var d = DEPTH[t[4]]; var s = t[3] * sc; k++;
            tiles.push({ name: name, x0: x, y0: y, s: s, depth: t[4], d: d, ph: hash(k) * 6.283, per: 6 + hash(k + 9) * 5, amp: (3 + hash(k + 3) * 4) * sc, tile: null });
          });
        }
      }
      tiles.sort(function (a, b) { return a.depth - b.depth; });
      tiles.forEach(prerender);
    }
    function prerender(t) {
      var im = imgs[t.name]; if (!im) return; var pad = Math.ceil((t.d.blur * 2 + 24) * dpr); var s = Math.round(t.s * dpr);
      var c = document.createElement('canvas'); c.width = s + pad * 2; c.height = s + pad * 2; var g = c.getContext('2d');
      var r = s * 0.12;
      if (t.d.blur) g.filter = 'blur(' + (t.d.blur * dpr) + 'px)';
      g.save(); g.shadowColor = 'rgba(21,21,21,' + (t.depth === 2 ? .22 : .14) + ')'; g.shadowBlur = 18 * dpr; g.shadowOffsetY = 8 * dpr;
      rr(g, pad, pad, s, r); g.fillStyle = '#fff'; g.fill(); g.restore();
      g.save(); rr(g, pad, pad, s, r); g.clip(); g.drawImage(im, pad, pad, s, s); g.restore();
      g.save(); rr(g, pad + .5, pad + .5, s - 1, r); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1 * dpr; g.stroke(); g.restore();
      t.tile = c; t.pad = pad / dpr;
    }
    function mod(a, n) { return ((a % n) + n) % n; }
    function renderAt(time) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      var sc = Math.max(W, H * 1.6) / REF_W;
      for (var i = 0; i < tiles.length; i++) {
        var t = tiles[i]; if (!t.tile) continue;
        var dist = time * speed * sc * t.d.spd;
        var x = mod(t.x0 + dir[0] * dist, FW) - M, y = mod(t.y0 + dir[1] * dist, FH) - M;
        y += Math.sin(time * 6.283 / t.per + t.ph) * t.amp; x += Math.cos(time * 6.283 / (t.per * 1.3) + t.ph) * t.amp * .5;
        if (x > W + t.s || y > H + t.s || x < -t.s * 2 || y < -t.s * 2) continue;
        ctx.globalAlpha = t.d.alpha; ctx.drawImage(t.tile, x - t.s / 2 - t.pad, y - t.s / 2 - t.pad, t.tile.width / dpr, t.tile.height / dpr);
      }
      ctx.globalAlpha = 1;
    }

    ready.then(function () {
      build();
      report.covers = loaded + '/' + NAMES.length + ' covers';
      if (!loaded) { console.warn(TAG + 'hero covers did not load. Check the GitHub upload.'); }
      var t = 0, last = null, raf = 0, visible = true;
      function loop(now) {
        if (last !== null) { t += Math.min(.1, (now - last) / 1000); }
        last = now; renderAt(t); raf = requestAnimationFrame(loop);
      }
      function start() { if (!raf && !reduce && visible && !document.hidden) { last = null; raf = requestAnimationFrame(loop); } }
      function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
      renderAt(0);
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (es) { visible = es[0].isIntersecting; if (visible) start(); else stop(); }).observe(canvas);
      }
      document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });
      start();
      var to; window.addEventListener('resize', function () { clearTimeout(to); to = setTimeout(function () { build(); renderAt(t); }, 150); });
    });
  }

  /* ---------- Testimonials ----------
     Moves on every TESTIMONIAL_MS (the active dot fills up as a timer).
     Arrows, dots and swipe still work and restart the timer. Pauses while
     the pointer or keyboard focus is on the card, when it's off screen or
     the tab is hidden, and doesn't auto-advance for reduced motion. */
  function initTestimonials() {
    var slides = [].slice.call(document.querySelectorAll('.pac-tslide'));
    var foot = document.querySelector('.pac-tfoot');
    var tcard = document.querySelector('.pac-tcard');
    report.testimonials = slides.length;
    if (slides.length < 2 || !foot) return;
    var dots = foot.querySelector('.pac-dots'), i = 0;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var timer = null, hovering = false, focused = false, inView = true;
    dots.style.setProperty('--pac-auto', TESTIMONIAL_MS + 'ms');
    slides.forEach(function (s, k) {
      var d = document.createElement('i');
      d.addEventListener('click', function () { show(k); schedule(); });
      dots.appendChild(d);
    });
    function show(n) {
      i = (n + slides.length) % slides.length;
      slides.forEach(function (s, k) {
        s.classList.toggle('is-active', k === i);
        s.setAttribute('aria-hidden', k === i ? 'false' : 'true');
        s.setAttribute('aria-label', (k + 1) + ' of ' + slides.length);
      });
      [].forEach.call(dots.children, function (d, k) { d.classList.toggle('is-on', k === i); });
    }
    function schedule() {
      clearTimeout(timer); timer = null;
      dots.classList.remove('is-running');
      if (reduce || hovering || focused || !inView || document.hidden) return;
      void dots.offsetWidth;               /* restart the dot fill */
      dots.classList.add('is-running');
      timer = setTimeout(function () { show(i + 1); schedule(); }, TESTIMONIAL_MS);
    }
    foot.querySelector('.pac-prev').addEventListener('click', function () { show(i - 1); schedule(); });
    foot.querySelector('.pac-next').addEventListener('click', function () { show(i + 1); schedule(); });
    if (tcard) {
      tcard.addEventListener('mouseenter', function () { hovering = true; schedule(); });
      tcard.addEventListener('mouseleave', function () { hovering = false; schedule(); });
      /* keyboard focus pauses it; a mouse click on an arrow doesn't */
      tcard.addEventListener('focusin', function (e) {
        var kb = true; try { kb = e.target.matches(':focus-visible'); } catch (x) {}
        if (kb) { focused = true; schedule(); }
      });
      tcard.addEventListener('focusout', function () { focused = false; schedule(); });
    }
    /* Swipe on phones */
    var track = document.querySelector('.pac-tslides'), x0 = null, y0 = null;
    if (track) {
      track.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
      track.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { show(dx < 0 ? i + 1 : i - 1); schedule(); }
        x0 = null;
      }, { passive: true });
    }
    if ('IntersectionObserver' in window && tcard) {
      new IntersectionObserver(function (es) { inView = es[0].isIntersecting; schedule(); }, { threshold: 0.3 }).observe(tcard);
    }
    document.addEventListener('visibilitychange', schedule);
    foot.hidden = false;
    show(0);
    schedule();
    report.autoplay = reduce ? 'off (reduced motion)' : (TESTIMONIAL_MS / 1000) + 's';
  }

  /* ---------- CFO stats: count up from 0 when scrolled into view ----------
     "Millions" counts 1 → 10 → 100 … → 1,000,000 (each power of ten a beat),
     then the number rolls up and out and the word rolls in. Final values are
     in the HTML, so screen readers, no-JS and reduced motion see them as is. */
  function initStats() {
    var nums = [].slice.call(document.querySelectorAll('.pac-stat .pac-n[data-count]'));
    if (!nums.length) return;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window) || !window.requestAnimationFrame) { report.stats = 'static'; return; }

    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
    function commas(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

    nums.forEach(function (el) {
      var kind = el.getAttribute('data-count');
      if (kind === 'millions') {
        el.innerHTML = '<span class="pac-roll" aria-hidden="true"><span class="pac-roll-a">0</span><span class="pac-roll-b">Millions</span></span>';
      } else {
        el.innerHTML = '<span aria-hidden="true">0</span><small aria-hidden="true">' + (el.getAttribute('data-suffix') || '') + '</small>';
        if (el.getAttribute('data-dec')) { el.firstChild.textContent = (0).toFixed(+el.getAttribute('data-dec')); }
      }
    });

    function countTo(el, delay) {
      var to = parseFloat(el.getAttribute('data-count')), dec = +(el.getAttribute('data-dec') || 0);
      var out = el.firstChild, dur = 1600, start = null;
      setTimeout(function () {
        requestAnimationFrame(function step(ts) {
          if (start === null) start = ts;
          var t = Math.min(1, (ts - start) / dur);
          out.textContent = (to * easeOut(t)).toFixed(dec);
          if (t < 1) { requestAnimationFrame(step); } else { out.textContent = to.toFixed(dec); el.classList.add('is-landed'); }
        });
      }, delay);
    }

    function millions(el, delay) {
      var a = el.querySelector('.pac-roll-a'), dur = 1500, start = null;
      setTimeout(function () {
        requestAnimationFrame(function step(ts) {
          if (start === null) start = ts;
          var t = Math.min(1, (ts - start) / dur);
          /* climbs through the powers of ten, fast at first then settling */
          var v = Math.floor(Math.pow(10, 6 * easeOut(t)));
          a.textContent = commas(t < 1 ? Math.min(v, 999999) : 1000000);
          if (t < 1) { requestAnimationFrame(step); }
          else { setTimeout(function () { el.classList.add('is-rolled'); setTimeout(function () { el.classList.add('is-landed'); }, 450); }, 250); }
        });
      }, delay);
    }

    var grid = document.querySelector('.pac-stats');
    var io = new IntersectionObserver(function (es) {
      if (!es[0].isIntersecting) return;
      io.disconnect();
      nums.forEach(function (el, k) {
        if (el.getAttribute('data-count') === 'millions') { millions(el, k * 150); } else { countTo(el, k * 150); }
      });
    }, { threshold: 0.35 });
    io.observe(grid || nums[0]);
    report.stats = 'count-up ready';
  }

  function safely(name, fn) {
    try { fn(); }
    catch (err) { console.error(TAG + name + ' failed', err); }
  }

  function printReport() {
    var bits = [];
    bits.push(report.fields ? report.fields + ' form fields in the card (' + (report.agreement || 'no agreement') + ')' : 'form NOT placed yet');
    bits.push((report.ctas || 0) + ' "' + SUBMIT_LABEL + '" CTA ready');
    bits.push(report.covers || 'covers loading');
    if (report.stats) { bits.push('stats ' + report.stats); }
    if (report.autoplay) { bits.push(report.testimonials + ' testimonials, auto ' + report.autoplay); }
    console.log(TAG + bits.join(', '));
  }

  ready(function () {
    safely('scroll', initScroll);
    safely('form watcher', watchForForm);
    safely('testimonials', initTestimonials);
    safely('stats', initStats);
    safely('covers', initCovers);
    safely('fitPage', fitPage);
    /* Re-fit whenever the page changes height (fonts, images, testimonials) */
    var pageEl = document.querySelector('.exos-page');
    if (pageEl && 'ResizeObserver' in window) { new ResizeObserver(function () { fitPage(); }).observe(pageEl); }
    setTimeout(fitPage, 3000); setTimeout(fitPage, 6000);
  });

  window.addEventListener('load', function () { placeForm(); fitPage(); setTimeout(printReport, 1500); });
  /* Unbounce re-applies its own layout on resize and orientation change,
     so strip it again each time. */
  function reapply() {
    var slot = document.querySelector('.exos-form-slot');
    if (slot && slot.getAttribute('data-built')) { unstyle(slot); }
    fitPage();
  }
  window.addEventListener('resize', reapply);
  window.addEventListener('orientationchange', reapply);
  setTimeout(reapply, 800);
  setTimeout(reapply, 2000);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitPage); }

})();
</script>
